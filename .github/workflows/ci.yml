name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Supported Node.js release lines (Node 20 reached end of life on 2026-04-30).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Mocked tests only: a network guard fails any real request. Live validation
      # needs real Google credentials and is never run in CI.
      - run: npm test
      - run: npm run build
      - name: CLI smoke test
        run: node dist/index.js --help
      - name: Inspect package contents
        run: npm run pack:check

  csv-skill:
    name: CSV audit skill / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Synthetic fixtures only; the tests block network access.
      - run: python -I -m unittest discover -s skills/youtube-csv-audit/tests -v
      - run: python -I skills/youtube-csv-audit/scripts/yt_csv_audit.py --selftest
